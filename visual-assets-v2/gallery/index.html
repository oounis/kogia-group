<!doctype html>
<html lang="fr" data-kogia-product="group">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kogia · revue d'actifs visuels V2</title>
  <link rel="stylesheet" href="../../visual-assets/tokens/product-colors.css">
  <link rel="stylesheet" href="review.css">
  <style>
    /* Coquille minimale : la revue elle-même est entièrement portée par .kg-v2. */
    body{margin:0;background:#F4F7FA;color:#0E2135;font:15px/1.5 Inter,system-ui,sans-serif}
    header{
      display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;
      padding:18px clamp(20px,5vw,48px);background:#fff;border-bottom:1px solid #DCE3EB
    }
    h1{margin:0;font:700 clamp(23px,4vw,32px)/1.15 Sora,system-ui}
    .eyebrow{margin:0 0 4px;color:var(--kg-accent-600);font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
    label{display:grid;gap:5px;color:#485868;font-size:12px;font-weight:700}
    select{min-width:170px;padding:9px 12px;border:1px solid #DCE3EB;border-radius:12px;background:#fff;color:#0E2135;font:inherit}
    .note{margin:20px clamp(20px,5vw,48px) 0;color:#485868;font-size:13px}
    .note a{color:var(--kg-accent-600)}
    #review{margin:16px clamp(20px,5vw,48px) 40px}
  </style>
</head>
<body>
  <header>
    <div>
      <p class="eyebrow">Art : Codex · Intégration : Claude · Approbation : Othman</p>
      <h1>Revue d'actifs visuels V2</h1>
    </div>
    <label>Couleur produit <select id="product"></select></label>
  </header>
  <p class="note">
    Page autonome du paquet candidat. La même revue est montée dans la galerie de
    production, sous la bascule « Revue V2 » :
    <a href="../../visual-assets/gallery/index.html">ouvrir la galerie</a>.
  </p>
  <div id="review"></div>

  <script type="module">
    import { renderReviewV2 } from "./review.js";
    const manifest = await renderReviewV2({ base: "..", mount: document.querySelector("#review") });
    const product = document.querySelector("#product");
    for (const [id, item] of Object.entries(manifest.products)) product.add(new Option(item.name, id));
    product.addEventListener("change", () => { document.documentElement.dataset.kogiaProduct = product.value; });
  </script>
</body>
</html>
