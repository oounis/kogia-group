name: Deploy Kogia Group site to Pages
# ⚠️ DÉCLENCHEMENT AUTOMATIQUE RETIRÉ LE 2026-08-17.
# Depuis le 2026-08-16, kogiagroup.com est servi par Render (dossier
# community/), plus par GitHub Pages. Ce workflow continuait de réussir à
# chaque push tout en publiant vers une destination inatteignable :
# oounis.github.io/kogia-group/ renvoie un 301 vers kogiagroup.com, que
# Render possède désormais. Chaque badge vert était un faux positif.
#
# Volontairement CONSERVÉ en `workflow_dispatch` : l'ancien site statique
# vit toujours dans site/ et reste la voie de retour si le nouveau site
# doit être annulé. Pour revenir en arrière : repointer le DNS de
# kogiagroup.com vers GitHub Pages, puis lancer ce workflow à la main.
on: { workflow_dispatch: {} }
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      # Sitemap complet + liens statiques : les articles existent pour les
      # moteurs, pas seulement pour les navigateurs qui exécutent le script.
      - name: Construire sitemap et liens statiques
        run: python3 tools/construire.py
      # Une seule feuille de style dans le dépôt, zéro CSS bloquant en ligne.
      - name: Replier la feuille de style dans les pages
        run: python3 tools/inline-css.py
      # La porte de qualité : routes, og:url, ancres, sitemap, gabarit.
      # Elle échoue = rien n'est publié.
      - name: Vérifier avant publication
        run: python3 tools/verifier.py
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: d
        uses: actions/deploy-pages@v4
