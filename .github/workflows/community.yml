# ════════════════════════════════════════════════════════════════════════════
# LA PORTE DE QUALITÉ DU SITE — community/ sert kogiagroup.com depuis le
# 2026-08-16.
#
# Avant ce fichier (ajouté le 2026-08-17), ce dossier n'avait AUCUNE CI : le
# site public partait en production sur la seule foi de vérifications lancées
# à la main en local. Le seul workflow du dépôt validait `site/`, l'ancien
# site statique retiré du domaine — il ne regardait pas une ligne du code
# réellement servi.
#
# DEPUIS LE 2026-08-30 : le site n'est plus sur Render (suspendu) ni sur
# GitHub Pages (désactivé le même jour). Il tourne sur kogia-prod-01
# (13.140.153.6), déployé À LA MAIN par community/deploy/deploy.sh. Il n'y a
# donc plus aucun déploiement automatique sur push : cette porte peut mentir
# sur ce qui est EN LIGNE, elle ne dit la vérité que sur ce qui est dans
# main. Ce qui est en ligne, c'est ce qui a été déployé en dernier.
# ════════════════════════════════════════════════════════════════════════════
name: Qualité — site kogiagroup.com (community/)

on:
  push:
    branches: [main]
    paths: ['community/**', '.github/workflows/community.yml']
  pull_request:
    branches: [main]
    paths: ['community/**', '.github/workflows/community.yml']
  workflow_dispatch:

# Groupe qui inclut la référence : deux PR ne s'annulent pas mutuellement.
# (La même erreur existait sur coreon-edu et y a annulé quatre PR de
# sécurité — voir coreon-edu PR #30.)
concurrency:
  group: "community-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

defaults:
  run:
    working-directory: community

jobs:
  qualite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # ⚠️ DOIT correspondre au Node de Render, sinon cette porte valide un
      # runtime différent de la production et ne prouve plus rien.
      # Constaté le 2026-08-18 : `engines: >=22` laissait Render choisir, il
      # prenait 26.7.0 pendant que la CI testait en 22. `engines` est
      # maintenant borné (>=22 <27) et les deux côtés utilisent 26.
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: community/package-lock.json

      - name: Installer (verrouillé)
        run: npm ci

      # Deux fichiers de l'app sont GÉNÉRÉS depuis les sources uniques du dépôt
      # (brand/tokens/kogia.css, visual-assets/icons/svg). S'ils dérivent, on
      # n'a plus une source mais deux : la porte refuse.
      - name: Fichiers générés à jour (jetons Harmony, registre d'icônes)
        run: node tools/synchroniser-jetons.mjs --check && node tools/generer-icones.mjs --check

      - name: Lint
        run: npm run lint

      # Fonctionne sur un dépôt propre depuis que layout.tsx n'utilise plus
      # le global `LayoutProps` généré par Next, qui n'existe qu'après build.
      - name: Types
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # Le build rend des pages qui interrogent Supabase. Sans ces
          # variables il échoue à la génération statique, pas au compilateur —
          # un échec déroutant si on ne le sait pas.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

  # Le site réel, après coup : un 200 ne prouve pas qu'une page s'affiche.
  # C'est exactement le piège qui a laissé /suite/ complètement blanc pendant
  # une journée en répondant 200 (voir kogia-domain-cutover mémoire).
  fumee-production:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: qualite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26

      - name: Installer Playwright
        run: npm i -D @playwright/test && npx playwright install --with-deps chromium

      - name: Laisser Render finir son déploiement
        run: sleep 90

      - name: Le site rend-il vraiment quelque chose ?
        run: npx playwright test --config=playwright.smoke.config.ts
